<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Producción</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="produccionStyle.css">
</head>
<body>

    <div class="app-container">
        <form id="formProduccion" class="mt-2">

        <div class="tarjeta-fecha" onclick="document.getElementById('selectorFecha').showPicker()">
            <i class="bi bi-calendar-check fs-3"></i>
            <div>
                <div id="fechaTexto" class="fw-bold">Seleccionar Fecha</div>
                <div id="diaTexto" class="small text-muted">Toca para elegir</div>
            </div>
        </div>
        <input type="date" id="selectorFecha" name="fecha" hidden>

        <div class="titulo-seccion mt-5 mb-4">Producción</div>

            
            <div class="row g-2 mb-3 align-items-center">
                <div class="col-8">
                    <div class="etiqueta-blanca">Huevos grandes</div>
                </div>
                <div class="col-4">
                    <input type="number" name="cantidad_grande" class="form-control input-personalizado" placeholder="0" min="0">
                </div>
            </div>

            <div class="row g-2 mb-3 align-items-center">
                <div class="col-8">
                    <div class="etiqueta-blanca">Huevos pequeños</div>
                </div>
                <div class="col-4">
                    <input type="number" name="cantidad_pequeno" class="form-control input-personalizado" placeholder="0" min="0">
                </div>
            </div>

            <div id="mensajeAlerta" class="text-center mt-3 mb-3"></div>

            <div class="barra-inferior">
                <a href="menu.php" class="btn btn-atras">
                    <i class="bi bi-chevron-left"></i> Atrás
                </a>
                
                <button type="submit" class="btn btn-guardar">
                    <i class="bi bi-download"></i> Guardar
                </button>
                
                <button type="button" class="btn btn-oscuro">
                    <i class="bi bi-database"></i>
                </button>
            </div>
        </form>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <script>
        // 1. Script para cambiar el texto cuando el usuario elija fecha
        $("#selectorFecha").on("change", function(){
            let fechaSeleccionada = $(this).val();
            $("#fechaTexto").text(fechaSeleccionada);
            $("#diaTexto").text("Fecha lista");
        });

        // 2. Lógica AJAX para enviar los datos sin recargar la página
        $("#formProduccion").on("submit", function(e){
            e.preventDefault(); // Evita que la página parpadee o se recargue

            // Validamos que haya una fecha antes de enviar
            if(!$("#selectorFecha").val()){
                $("#mensajeAlerta").html('<span class="text-danger fw-bold">⚠️ Selecciona una fecha</span>');
                return;
            }

            $.ajax({
                url: "guardar_produccion.php", // El archivo PHP 'Chef'
                type: "POST",                 // Método de envío seguro
                data: $(this).serialize(),    // Empaqueta todos los inputs con 'name'
                success: function(respuesta){ // Lo que responde el servidor
                    console.log("Servidor responde: " + respuesta);
                    // Usamos includes("ok") por si el servidor manda espacios en blanco
                    if(respuesta.includes("ok")){
                        // Mensaje verde del prototipo
                        $("#mensajeAlerta").html('<span class="text-success fw-bold">✓ Producción registrada correctamente.</span>');
                        $("#formProduccion")[0].reset(); // Limpia los números
                        $("#fechaTexto").text("Seleccionar Fecha");
                        $("#diaTexto").text("Toca para elegir");
                    } else {
                        // Mensaje rojo de error
                        $("#mensajeAlerta").html('<span class="text-danger fw-bold">⚠️ Error: ' + respuesta + '</span>');
                    }
                }
            });
        });
    </script>
</body>
</html>
