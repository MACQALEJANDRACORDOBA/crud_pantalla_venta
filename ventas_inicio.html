<body>

<div class="app-container">

</div> <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<script>
$(document).ready(function () {
    // 1. Poner la fecha real en el Header dinámicamente apenas cargue la página
    const opcionesFecha = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
    const fechaHoy = new Date();
    
    const diaMesAnio = fechaHoy.toLocaleDateString('es-CO', { day: 'numeric', month: 'long', year: 'numeric' });
    const diaSemana = fechaHoy.toLocaleDateString('es-CO', { weekday: 'long' });
    const diaSemanaFormateado = diaSemana.charAt(0).toUpperCase() + diaSemana.slice(1);

    $(".header-izq div strong").text(diaMesAnio);
    $(".header-izq div small").text(diaSemanaFormateado);

    // 2. Luego llamamos a la base de datos para traer las ventas
    cargarVentas();
});

// Forzar la apertura del calendario si el usuario toca el botón redondo
$(".header-der").click(function() {
    // Al hacer click en el contenedor, obligamos al input date a enfocarse o abrirse
    $("#filtroFechaVenta").focus().click();
});

function cargarVentas() {
    $.ajax({
        url: "obtener_ventas.php",
        type: "GET",
        dataType: "json",
        success: function (ventas) {
            if(ventas.error) {
                console.error("Error del servidor:", ventas.error);
                return;
            }

            let html = "";
            ventas.forEach(function (venta) {
                let total = parseInt(venta.cantidad_total) || 0;
                let cubetas = Math.floor(total / 30);
                let unidades = total % 30;
                
                let textoCantidad = "";
                if(unidades === 0){
                    textoCantidad = cubetas + " cubetas (" + total + ")";
                } else {
                    textoCantidad = cubetas + " cubetas + " + unidades + " huevos (" + total + ")";
                }

                html += `
                <div class="card-venta" onclick="abrirVenta(${venta.id_venta})" data-fecha="${venta.fecha}" style="cursor:pointer;">
                    <div class="venta-header">
                        <strong>${venta.cliente}</strong>
                        <span class="estado ${venta.estado}">
                            ${venta.estado === "abono" ? "Abonó" : 
                              venta.estado === "pendiente" ? "Pendiente" : 
                              "Cancelado"}
                        </span>
                    </div>

                    <div class="venta-body">
                        Fecha: ${venta.fecha} <br>
                        Tamaño: ${venta.tamano} <br>
                        Cantidad: ${textoCantidad} <br>
                        Nota: ${venta.nota ? venta.nota : "Sin nota"}
                    </div>

                    <div class="venta-footer">
                        $ ${parseInt(venta.total).toLocaleString("es-CO")} 
                    </div>
                </div>`;
            });

            $("#listaVentas").html(html);
        },
        error: function(xhr, status, error) {
            console.error("Error en la petición AJAX:", error);
        }
    });
}

function abrirVenta(id){
    window.location.href = "detalle_venta.html?id=" + id;
}

// FILTRO DE FECHAS DINÁMICO
$("#filtroFechaVenta").on("change", function() {
    let fechaSeleccionada = $(this).val(); 
    
    if(fechaSeleccionada) {
        let fechaObj = new Date(fechaSeleccionada + "T00:00:00");
        
        let diaMesAnio = fechaObj.toLocaleDateString('es-CO', { day: 'numeric', month: 'long', year: 'numeric' });
        let diaSemana = fechaObj.toLocaleDateString('es-CO', { weekday: 'long' });
        let diaSemanaFormateado = diaSemana.charAt(0).toUpperCase() + diaSemana.slice(1);

        $("#textoFechaFiltro").text(diaMesAnio);
        $("#textoDiaSemana").text("Filtrado: " + diaSemanaFormateado);

        $("#contenedorLimpiar").fadeIn();

        $(".card-venta").hide();
        $(".card-venta").each(function() {
            let fechaVenta = $(this).data("fecha"); 
            if(fechaVenta === fechaSeleccionada) {
                $(this).show();
            }
        });
    }
});

$("#btnLimpiarFiltro").click(function() {
    $("#filtroFechaVenta").val("");
    
    const fechaHoy = new Date();
    const diaMesAnio = fechaHoy.toLocaleDateString('es-CO', { day: 'numeric', month: 'long', year: 'numeric' });
    const diaSemana = fechaHoy.toLocaleDateString('es-CO', { weekday: 'long' });
    const diaSemanaFormateado = diaSemana.charAt(0).toUpperCase() + diaSemana.slice(1);

    $("#textoFechaFiltro").text(diaMesAnio);
    $("#textoDiaSemana").text(diaSemanaFormateado);
    
    $("#contenedorLimpiar").fadeOut();
    $(".card-venta").show();
});
</script>
</body>
</html>
